[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roguecast"
version = "0.1.0"
description = "Research-stage predictive authorization-boundary risk for AI agents"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1,<3", "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "joblib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
roguecast = "roguecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
